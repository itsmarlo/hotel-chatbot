services:
  api:
    build: .
    command: ["uvicorn", "hotel_assistant.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      HOTEL_API_PORT: "8000"
      HOTEL_DATABASE_PATH: /app/data/synthetic/hotel.db
    ports:
      - "8000:8000"
    volumes:
      - hotel-data:/app/data/synthetic

  ui:
    build: .
    environment:
      HOTEL_UI_PORT: "7860"
    ports:
      - "7860:7860"

volumes:
  hotel-data:
