services:
  api:
    build: .
    command: ["uvicorn", "hotel_assistant.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      HOTEL_API_PORT: "8000"
      HOTEL_DATABASE_PATH: /app/data/synthetic/hotel.db
    ports:
      - "8000:8000"
    volumes:
      - hotel-data:/app/data/synthetic
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s

  ui:
    build: .
    environment:
      HOTEL_UI_PORT: "7860"
      HOTEL_DATABASE_PATH: /app/data/synthetic/hotel.db
    ports:
      - "7860:7860"
    volumes:
      - hotel-data:/app/data/synthetic

  qwen:
    profiles: ["qwen"]
    build: .
    environment:
      HOTEL_UI_PORT: "7860"
      HOTEL_DATABASE_PATH: /app/data/synthetic/hotel.db
      HOTEL_NLP_MODE: qwen
      HOTEL_QWEN_MODEL_PATH: /app/models/cache/qwen
      HOTEL_QWEN_LOCAL_ONLY: "1"
    ports:
      - "7861:7860"
    volumes:
      - hotel-data:/app/data/synthetic
      - ./models/cache/qwen:/app/models/cache/qwen:ro

volumes:
  hotel-data:
